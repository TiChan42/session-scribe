name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked verification dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint, format and focused synthetic tests
        run: |
          ruff check src scripts tests host_tests
          ruff format --check src scripts tests host_tests
          pytest -q
          python scripts/check_public.py
      - name: Verify package contents
        run: |
          python -m build --wheel --no-isolation
          python scripts/check_public.py --wheel dist/*.whl
  host-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install hash-locked host and build dependencies
        run: |
          python -m pip install --require-hashes -r requirements/host.txt
          python -m pip install --require-hashes -r requirements/build.txt
      - name: Build, install and test the actual host wheel
        run: |
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/sessionscribe-0.1.0-py3-none-any.whl
          python -c 'from pathlib import Path; import sessionscribe; from sessionscribe.models import Session; assert "site-packages" in Path(sessionscribe.__file__).parts; assert "speaker_aliases" in Session.model_fields'
          python -W error::ResourceWarning -m pytest -o pythonpath= -q host_tests
