[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionscribe"
version = "0.1.0"
description = "Consent-gated session recording and isolated transcript processing"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.12.5"]

[project.optional-dependencies]
recorder = ["soundfile==0.13.1", "numpy==2.2.6", "py-cord==2.8.1"]
stt = ["faster-whisper==1.2.1", "ctranslate2==4.6.0", "av==15.1.0",
       "huggingface-hub==0.36.0", "tokenizers==0.22.1", "onnxruntime==1.23.2",
       "numpy==2.2.6", "tqdm==4.67.1"]
dev = ["pytest==9.0.2", "ruff==0.14.3", "build==1.3.0"]

[project.scripts]
sessionscribe = "sessionscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
